# =============================================================================
# Schema mapping - translates PUBLIC field names to your DISCOVERED index layout
# =============================================================================
# Copy to config/schema_mapping.yaml and edit to match the payload keys and
# PostgreSQL columns recorded in docs/discovery-report.md.
#
# This file is the single place where the shape of the existing index is
# described. The retrieval engine reads NOTHING about payload structure from
# hardcoded constants - it all comes from here (spec section 25).
#
# Field/table/column names in this file come from TRUSTED configuration, never
# from clients. Client requests can only reference the PUBLIC names under
# `filters:`; they can never inject a raw payload key, column, or SQL fragment.
# =============================================================================

# Optional defaults applied to every collection unless overridden.
defaults:
  # Where citation metadata comes from: qdrant | postgres | both.
  # "both" means: start from Qdrant payload, fill gaps from PostgreSQL.
  metadata_source: qdrant
  # Named-vector name. null for a single unnamed vector (the common case).
  vector_name: null

collections:
  # The key MUST also appear in QDRANT_ALLOWED_COLLECTIONS.
  documents:
    description: >-
      Primary indexed document collection (PDFs, Office files, notes) served
      read-only for retrieval.
    vector_name: null
    metadata_source: qdrant

    # Map domain fields -> Qdrant payload keys. Use null when a field is absent.
    # `text` may be null if chunk text lives only in PostgreSQL (set
    # metadata_source: both and map text under postgres.columns instead).
    payload:
      text: text
      document_id: document_id
      chunk_id: chunk_id          # null => fall back to the Qdrant point id
      filename: filename
      title: title
      page_number: page_number
      slide_number: slide_number
      sheet_name: sheet_name
      section: section
      file_type: file_type
      source_uri: null            # keep null unless a SAFE opaque URI is stored
      modified_at: modified_at
      created_at: created_at
      folder: folder
      # Explicit chunk ordering for neighbour expansion. NEVER rely on lexical
      # chunk-id ordering - only an explicit numeric sequence is trusted.
      sequence: chunk_index
      # Latest/active-version flag used for dedup + ranking; null if absent.
      active_flag: null

    # Public filter name -> payload key. Only these names are accepted from
    # clients. Anything else is rejected as an unsupported filter.
    filters:
      file_type: file_type
      folder: folder

    # Only consulted when metadata_source is `postgres` or `both`.
    postgres:
      schema: public
      # Prefer a VIEW that exposes only client-safe columns.
      table: rag_document_metadata_v
      # lookup_key: match rows per document ("document_id") or per chunk
      # ("chunk_id" - use this when per-chunk data like the text lives in
      # PostgreSQL keyed by chunk id).
      lookup_key: document_id
      key_column: document_id
      # drop_if_missing: remove a result whose row is absent. Set true when the
      # view already excludes removed/superseded rows, to enforce liveness.
      drop_if_missing: false
      columns:
        filename: filename
        title: title
        source_uri: source_uri
        modified_at: modified_at
        file_type: file_type

  # ---------------------------------------------------------------------------
  # Example B (commented): chunk TEXT lives in PostgreSQL, keyed by chunk_id, and
  # liveness is enforced by an approved VIEW that excludes removed rows. This is
  # the pattern when Qdrant stores only vectors + metadata (e.g. an Ollama-built
  # index). Point EMBEDDING_* at the same model/dimensions the indexer used.
  #
  # knowledge_chunks:
  #   description: Indexed document chunks (text hydrated from PostgreSQL).
  #   vector_name: null
  #   metadata_source: both          # payload for ids/page/type; PostgreSQL for text
  #   # Chunk order lives in PostgreSQL (chunk_index), so fetch neighbours from
  #   # there rather than Qdrant. Requires postgres.document_id_column and a
  #   # `sequence` column below. Use "qdrant" (default) if the order is a payload
  #   # key instead.
  #   neighbour_source: postgres
  #   payload:
  #     text: null                   # text is NOT in Qdrant
  #     document_id: document_id
  #     chunk_id: chunk_id           # payload chunk id (distinct from point id)
  #     page_number: page_or_slide_number
  #     section: section_title
  #     file_type: file_type
  #     modified_at: modified_time_ts
  #   filters:
  #     file_type: file_type
  #   postgres:
  #     schema: public
  #     table: rag_retrieval_chunks_v # a VIEW that JOINs chunks->documents->files
  #                                   # and WHERE files.status <> 'removed'
  #     lookup_key: chunk_id
  #     key_column: chunk_id
  #     document_id_column: document_id   # for postgres neighbour expansion
  #     drop_if_missing: true         # a hit with no row = removed -> dropped
  #     columns:
  #       text: text_display
  #       filename: file_name
  #       title: title
  #       modified_at: modified_time
  #       sequence: chunk_index       # chunk order, for postgres neighbours
  #   # Optional: return an openable link to the source document. Reconstructs a
  #   # path your machine can open from the stored (container/host) path. Example
  #   # maps a container path "/data/…" to a Windows UNC path on the Synology
  #   # share; pdf_page_anchor appends "#page=N" for PDFs.
  #   source_uri:
  #     from_payload: source_path
  #     strip_prefix: "/data/"
  #     add_prefix: "\\\\192.168.1.59\\aiagent-data-source\\"
  #     separator: "\\"
  #     pdf_page_anchor: true
